apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-react-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devops-react-app
  template:
    metadata:
      labels:
        app: devops-react-app
    spec:
      containers:
        - name: devops-react-app
          image: abhinavjain11/devops-react-app:latest
          ports:
            - containerPort: 5173