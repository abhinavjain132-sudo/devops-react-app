name: CD - Deploy to Kubernetes

on:
  workflow_run:
    workflows: ["React CI + Docker"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Check Kubernetes connection
        run: kubectl get nodes

      - name: Deploy image to Kubernetes
        run: kubectl set image deployment/devops-react-app devops-react-app=abhinavjain11/devops-react-app:${{ github.event.workflow_run.head_sha }}

      - name: Wait for rollout
        run: kubectl rollout status deployment/devops-react-app

      - name: Verify deployment
        run: kubectl get deployment devops-react-app -o wide